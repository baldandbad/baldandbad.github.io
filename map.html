<script>
  // basic escaping for popup injection safety
function escapeHtml(str){ return (str||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// to highlight a selected marker
function setActiveMarker(m) {
  if (activeMarker && activeMarker.getElement) {
    const prev = activeMarker.getElement();
    if (prev) prev.classList.remove('marker-active');
  }
  activeMarker = m;
  if (!m) return;
  const el = m.getElement();
  if (el) el.classList.add('marker-active');
  // bring to front so it's visible above cluster/others
  if (m._icon) m._icon.style.zIndex = 9999;
}

// share fallback for browsers
function sharePlace(name, lat, lng, page) {
  if (navigator.share) {
    navigator.share({ title: name, text: name, url: page || window.location.href }).catch(()=>{});
  } else {
    const shareUrl = page || `${location.origin}${location.pathname}?lat=${lat}&lng=${lng}`;
    navigator.clipboard?.writeText(shareUrl).then(()=> alert('URL copied to clipboard'));
  }
}
  // ---------- Blur-outside-polygon overlay (replace your prior fetch block) ----------
let boundaryLayer = null;
let blurSvg = null;
let blurMaskId = `blur-mask-${Date.now()}`;

function geoJSONToPathD(geojson, map) {
  // supports Polygon and MultiPolygon (returns combined path string)
  function ringToD(coords) {
    return coords.map(coord => {
      const p = map.latLngToLayerPoint([coord[1], coord[0]]); // NOTE: GeoJSON is [lng,lat]
      return `${p.x},${p.y}`;
    }).join(' ');
  }

  const geometry = geojson.type === 'Feature' ? geojson.geometry : geojson;
  let d = '';

  if (geometry.type === 'Polygon') {
    geometry.coordinates.forEach((ring, i) => {
      const pts = ring.map(c => map.latLngToLayerPoint([c[1], c[0]]));
      if (!pts.length) return;
      d += 'M ' + pts.map(p => `${p.x} ${p.y}`).join(' L ') + ' Z ';
    });
  } else if (geometry.type === 'MultiPolygon') {
    geometry.coordinates.forEach(polygon => {
      polygon.forEach(ring => {
        const pts = ring.map(c => map.latLngToLayerPoint([c[1], c[0]]));
        if (!pts.length) return;
        d += 'M ' + pts.map(p => `${p.x} ${p.y}`).join(' L ') + ' Z ';
      });
    });
  }
  return d.trim();
}

function createOrUpdateBlurOverlay(geojsonFeature) {
  // Remove old SVG if exists
  if (blurSvg && blurSvg.parentNode) {
    blurSvg.parentNode.removeChild(blurSvg);
    blurSvg = null;
  }

  // Create SVG element sized to map container (use viewBox to match pixel coords)
  const size = map.getSize();
  blurSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  blurSvg.setAttribute('width', size.x);
  blurSvg.setAttribute('height', size.y);
  blurSvg.setAttribute('viewBox', `0 0 ${size.x} ${size.y}`);
  blurSvg.style.position = 'absolute';
  blurSvg.style.top = '0';
  blurSvg.style.left = '0';
  blurSvg.style.pointerEvents = 'none'; // allow clicks through
  blurSvg.style.zIndex = 400; // overlayPane is below marker pane; adjust if needed

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');

  // filter (adjust stdDeviation for stronger/weaker blur)
  const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
  const filterId = `gblur-${Date.now()}`;
  filter.setAttribute('id', filterId);
  const fe = document.createElementNS('http://www.w3.org/2000/svg', 'feGaussianBlur');
  fe.setAttribute('in', 'SourceGraphic');
  fe.setAttribute('stdDeviation', '6'); // <-- change blur strength here
  filter.appendChild(fe);
  defs.appendChild(filter);

  // mask: white = show, black = hide. We want outside-blurred so:
  // mask = white full-rect, then black filled polygon(s) -> polygon area will be transparent (not blurred)
  const mask = document.createElementNS('http://www.w3.org/2000/svg', 'mask');
  const maskId = blurMaskId;
  mask.setAttribute('id', maskId);

  const whiteRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  whiteRect.setAttribute('x', '0');
  whiteRect.setAttribute('y', '0');
  whiteRect.setAttribute('width', size.x);
  whiteRect.setAttribute('height', size.y);
  whiteRect.setAttribute('fill', 'white');
  mask.appendChild(whiteRect);

  // compute path d from geojson (in pixel coords)
  const d = geoJSONToPathD(geojsonFeature, map) || '';

  if (d) {
    const holePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    holePath.setAttribute('d', d);
    holePath.setAttribute('fill', 'black'); // black = mask-out (i.e. transparent spot)
    mask.appendChild(holePath);
  }

  defs.appendChild(mask);
  blurSvg.appendChild(defs);

  // the blurred rect uses the filter and the mask we created
  const blurRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  blurRect.setAttribute('x', '0');
  blurRect.setAttribute('y', '0');
  blurRect.setAttribute('width', size.x);
  blurRect.setAttribute('height', size.y);
  // apply filter and mask
  blurRect.setAttribute('filter', `url(#${filterId})`);
  blurRect.setAttribute('mask', `url(#${maskId})`);
  // The rect color should be transparent but filter works on its graphic. To ensure a visible blur, fill with translucent white:
  // You can use rgba to simulate dim + blur; if you want *only* blur (no dim), use fill="transparent" (but some browsers won't blur 'transparent').
  // Using a semi-transparent white keeps underlying tiles visible but blurred; change opacity as desired.
  blurRect.setAttribute('fill', 'rgba(255,255,255,0.001)'); // nearly transparent but works with filter
  blurSvg.appendChild(blurRect);

  // Append svg into Leaflet overlayPane so markers and popups are above it
  map.getPanes().overlayPane.appendChild(blurSvg);
}

function refreshBlurMask(geojsonFeature) {
  if (!geojsonFeature) return;
  // Update svg size and mask path on view changes
  if (!blurSvg) {
    createOrUpdateBlurOverlay(geojsonFeature);
    return;
  }

  const size = map.getSize();
  blurSvg.setAttribute('width', size.x);
  blurSvg.setAttribute('height', size.y);
  blurSvg.setAttribute('viewBox', `0 0 ${size.x} ${size.y}`);

  // update existing mask path (assume it's the first <path> in mask)
  const mask = blurSvg.querySelector('mask');
  if (!mask) return;

  // Remove existing polygon path(s) then recreate
  const existingPaths = mask.querySelectorAll('path');
  existingPaths.forEach(p => p.remove());

  const d = geoJSONToPathD(geojsonFeature, map);
  if (d) {
    const holePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    holePath.setAttribute('d', d);
    holePath.setAttribute('fill', 'black');
    mask.appendChild(holePath);
  }
}

// helper: map category -> CSS class
function categoryClass(cat){
  return {
    thanhpho: 'marker-cat-thanhpho',
    quocgia:  'marker-cat-quocgia',
    kientruc: 'marker-cat-kientruc',
    baotang:  'marker-cat-baotang',
    khaoco:   'marker-cat-khaoco',
    dacbiet:  'marker-cat-dacbiet',
    khu:      'marker-cat-kientruc'
  }[cat] || 'marker-cat-default';
}


// helper: safe slug for thumbnail filename if you have thumbs (optional)
function slugify(s){ return String(s||'').toLowerCase().replace(/[^\w]+/g,'-'); }

// Keep reference to currently active marker
let activeMarker = null;

function setActiveMarker(m) {
  // remove previous
  if (activeMarker && activeMarker.getElement) {
    const prev = activeMarker.getElement();
    if (prev) prev.classList.remove('marker-active');
  }
  activeMarker = m;
  if (!m) return;
  const el = m.getElement();
  if (el) el.classList.add('marker-active');
  // bring to front visually
  if (m._icon) m._icon.style.zIndex = 1000;
}


const markerObjects = data.map(item => {
  // sizes must match CSS .my-div-icon
  const ICON_SIZE = 18;
  const innerClass = categoryClass(item.category);

  const html = `<div class="marker-inner ${innerClass}" aria-hidden="true"></div>`;
  const icon = L.divIcon({
    className: 'my-div-icon',   // container that we sized in CSS
    html: html,
    iconSize: [ICON_SIZE, ICON_SIZE],
    iconAnchor: [ICON_SIZE/2, ICON_SIZE/2]  // center the icon on the coordinate
  });

  const marker = L.marker(item.coords, { icon });

  const thumbUrl = `images/thumbs/${slugify(item.name)}.jpg`;
  const popupHtml = `
  <div style="min-width:220px">
    <img src="${thumbUrl}" style="width:100%;height:110px;object-fit:cover;border-radius:6px" onerror="this.style.display='none'"/>
    <h3 style="margin:8px 0 6px">${escapeHtml(item.name)}</h3>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
      <a class="popup-btn" href="${item.page}" target="_blank">Xem thêm</a>
      <a class="popup-btn" href="https://www.google.com/maps/dir/?api=1&destination=${item.coords[0]},${item.coords[1]}" target="_blank">Chỉ đường</a>
      ${item.vr !== "non" ? `<a class="popup-btn" href="${item.vr}" target="_blank">VR360</a>` : ""}
    </div>
  </div>
`;
  // offset slightly so popup appears above the dot (negative Y)
  marker.bindPopup(popupHtml, { minWidth: 220, offset: L.point(0, -ICON_SIZE/2 - 6), autoPan: true, keepInView: true });

  // lightweight tooltip (desktop only)
  marker.bindTooltip(item.name, { permanent: false, direction: 'top', className: 'my-tooltip', offset: [0, -ICON_SIZE/2 - 8] });

  // metadata for filters/search
  marker.category = item.category;
  marker.name = item.name;
  marker._page = item.page;

  // highlight + open popup on click
  marker.on('click', () => {
    setActiveMarker(marker);
    marker.openPopup();
  });

  // show tooltip only on pointer: fine (desktop). avoids popups on touch devices
  if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) {
    marker.on('mouseover', () => marker.openTooltip());
    marker.on('mouseout',  () => marker.closeTooltip());
  }

  // accessibility: make container focusable after it's added to the DOM
  marker.on('add', () => {
    const el = marker.getElement();
    if (!el) return;
    el.setAttribute('tabindex','0');
    el.setAttribute('role','button');
    el.setAttribute('aria-label', item.name);
    el.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); marker.fire('click'); }
    });
  });

  markerCluster.addLayer(marker);
  return marker;
});

/* This code uses public Google Maps URLs (no API key). It will try to embed in a modal iframe.
   If Google blocks embedding, we fall back to opening the URL in a new tab. */

/* create modal once */
(function(){
  if (document.getElementById('sv-modal')) return;
  const style = document.createElement('style');
  style.textContent = `
    #sv-modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:14000; }
    #sv-modal .sv-backdrop { position:absolute; inset:0; background:rgba(0,0,0,0.6); }
    #sv-modal .sv-panel { position:relative; width:min(1100px,94vw); height:min(720px,86vh); background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.5); display:flex; flex-direction:column; }
    #sv-modal .sv-header { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:#0b1220; color:#fff; font-weight:700; }
    #sv-modal .sv-body { flex:1; background:#000; display:flex; }
    #sv-modal iframe { width:100%; height:100%; border:0; display:block; }
    #sv-modal .sv-close { background:transparent; color:#fff; border:0; font-size:20px; cursor:pointer; padding:6px 10px; }
    #sv-modal .sv-fallback { padding:10px; text-align:center; font-size:13px; }
    .popup-btn.sv { background: #2563eb; } /* small visual tweak for the sv button */
  `;
  document.head.appendChild(style);

  const modal = document.createElement('div');
  modal.id = 'sv-modal';
  modal.innerHTML = `
    <div class="sv-backdrop" tabindex="-1"></div>
    <div class="sv-panel" role="dialog" aria-modal="true" aria-label="Street View">
      <div class="sv-header">
        <div class="sv-title">Xem 360</div>
        <div>
          <button class="sv-close" title="Đóng">✕</button>
        </div>
      </div>
      <div class="sv-body">
        <iframe sandbox="allow-scripts allow-same-origin allow-popups" src="about:blank" referrerpolicy="no-referrer"></iframe>
      </div>
      <div class="sv-fallback" style="display:none">
        Xem 360 không thể nhúng ở đây — <a class="sv-open-new" target="_blank" rel="noopener">Mở ở tab mới</a>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  const backdrop = modal.querySelector('.sv-backdrop');
  const closeBtn = modal.querySelector('.sv-close');
  const iframe = modal.querySelector('iframe');
  const fallback = modal.querySelector('.sv-fallback');
  const openNewLink = modal.querySelector('.sv-open-new');

  function closeModal(){
    iframe.src = 'about:blank';
    fallback.style.display = 'none';
    modal.style.display = 'none';
  }
  function openModalWithUrl(url){
    // try to embed
    modal.style.display = 'flex';
    iframe.src = url + '&output=embed';
    // set fallback link
    openNewLink.href = url;
    // after a short delay check if the iframe rendered a Google page or got blocked.
    // There is no reliable cross-origin check; do a pragmatic fallback: after 900ms if iframe
    // still has about:blank (rare) or user agent prevents rendering, show fallback.
    setTimeout(() => {
      // if iframe still 'about:blank' or has obvious block, show fallback — user can open new tab
      if (!iframe.src || iframe.src.indexOf('about:blank') !== -1) {
        fallback.style.display = 'block';
      } else {
        // sometimes Google will display a page that visually says "Sorry — we can't show" — user can close and open new tab
        fallback.style.display = 'none';
      }
    }, 900);
  }

  backdrop.addEventListener('click', closeModal);
  closeBtn.addEventListener('click', closeModal);
  // escape key
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.style.display === 'flex') closeModal(); });
  // expose helper
  window._openStreetViewModal = (lat, lng) => {
    // build a friendly Google Maps URL that opens at the nearest Street View pano:
    // use `layer=c&cbll=lat,lng&cbp=11,0,0,0,0`
    // also provide non-embed variant (without &output=embed) as fallback open-in-new
    const base = `https://www.google.com/maps?q=&layer=c&cbll=${encodeURIComponent(lat + ',' + lng)}&cbp=11,0,0,0,0`;
    try {
      openModalWithUrl(base);
    } catch (err) {
      // fallback: just open new tab
      window.open(base, '_blank', 'noopener');
    }
  };
})();

/* Insert Xem 360 button into popups when popup opens (uses the placeholder span in your popupHtml) */
map.on('popupopen', (ev) => {
  try {
    const popupEl = ev.popup.getElement();
    if (!popupEl) return;
    const placeholder = popupEl.querySelector('.sv-placeholder');
    if (!placeholder) return;

    // Coordinates stored by your popup placeholder attributes
    const lat = parseFloat(placeholder.dataset.lat);
    const lng = parseFloat(placeholder.dataset.lng);
    if (Number.isNaN(lat) || Number.isNaN(lng)) { placeholder.remove(); return; }

    // create button
    const btn = document.createElement('button');
    btn.className = 'popup-btn sv';
    btn.type = 'button';
    btn.textContent = 'Xem 360';
    btn.title = 'Mở Street View (không cần API key)';

    btn.addEventListener('click', () => {
      // Try to embed in modal; if blocked by X-Frame-Options, user can click "Mở ở tab mới"
      // If modal embedding fails visually, fallback code inside modal will provide open-in-new link.
      if (window._openStreetViewModal) {
        window._openStreetViewModal(lat, lng);
      } else {
        // final fallback: open new tab directly
        const url = `https://www.google.com/maps?q=&layer=c&cbll=${encodeURIComponent(lat + ',' + lng)}&cbp=11,0,0,0,0`;
        window.open(url, '_blank', 'noopener');
      }
    });

    // replace placeholder span with the button
    placeholder.replaceWith(btn);

  } catch (e) {
    // don't break popup if something goes wrong
    console.warn('Failed to attach Xem 360 button', e);
  }
});


  // --- Filter ---
  let activeFilter = "all";

    activeFilter = category;

  // --- Search ---
  const searchInput = document.getElementById("search");

  function removeAccents(str) {
    return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }

  searchInput.addEventListener("input", () => {
    const query = removeAccents(searchInput.value.trim());
    suggestions.innerHTML = "";
    if (!query) {
      suggestions.style.display = "none";
      return;
    }
    const matches = markerObjects.filter(m =>
      (activeFilter === "all" || m.category === activeFilter) &&
      removeAccents(m.name).includes(query)
    );
    if (matches.length) {
      suggestions.style.display = "block";
      matches.forEach(m => {
        const li = document.createElement("li");
        const regex = new RegExp(`(${query})`, "gi");
        const highlightedName = m.name.replace(regex, "<strong>$1</strong>");

        li.addEventListener("click", () => {
          map.setView(m.getLatLng(), 16, { animate: true });
          m.openPopup();
          suggestions.style.display = "none";
        });
        suggestions.appendChild(li);
      });
    } else {
      suggestions.style.display = "none";
    }
  });

  document.addEventListener("click", (e) => {
    if (!document.querySelector(".search-bar").contains(e.target)) {
      suggestions.style.display = "none";
    }

const mapDiv = document.getElementById('map');
const fullscreenBtn = document.getElementById('fullscreen-btn');
fullscreenBtn.addEventListener('click', () => {
  if (!document.fullscreenElement && !mapDiv.classList.contains('fullscreen')) {
    if (mapDiv.requestFullscreen) {
      mapDiv.requestFullscreen();
    } else if (mapDiv.webkitRequestFullscreen) {
      mapDiv.webkitRequestFullscreen();
    } else if (mapDiv.msRequestFullscreen) {
      mapDiv.msRequestFullscreen();
    }
    mapDiv.classList.add('fullscreen');
    document.body.classList.add('fullscreen-active');
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    } else if (document.msExitFullscreen) {
      document.msExitFullscreen();
    }
    mapDiv.classList.remove('fullscreen');
    document.body.classList.remove('fullscreen-active');
  }
});
// Keep map size correct on fullscreen change
function handleFullscreenChange() {
  if (!document.fullscreenElement) {
    mapDiv.classList.remove('fullscreen');
    document.body.classList.remove('fullscreen-active');
  } else {
    mapDiv.classList.add('fullscreen');
    document.body.classList.add('fullscreen-active');
  }
  if (window.map && window.map.invalidateSize) {
    setTimeout(() => window.map.invalidateSize(), 300);
  }
}
document.addEventListener('fullscreenchange', handleFullscreenChange);
document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
document.addEventListener('mozfullscreenchange', handleFullscreenChange);
document.addEventListener('MSFullscreenChange', handleFullscreenChange);

<script>
  fetch('js/hcmc-boundary.geojson')
  .then(res => res.json())
  .then(data => {
    L.geoJSON(data, {
      style: {
        color: "#ff5733",
        weight: 3,
        fill: false
      }
    }).addTo(map);
  });
  const filterBtn = document.getElementById("filter-btn");
  const filterPanel = document.getElementById("filter-panel");
  filterBtn.addEventListener("click", () => {
    filterPanel.classList.toggle("active");
  });

  const map = L.map('map', {
    minZoom: 10,
    maxZoom: 15,
    zoomControl: false
  }).setView([10.7769, 106.7009], 10);
  L.control.zoom({
  position: 'bottomleft'
  }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const markerCluster = L.markerClusterGroup({
    showCoverageOnHover: false,
    spiderfyOnEveryZoom: true,
    animate: true
  });
  map.addLayer(markerCluster);

  // Example data
const data = [
  { name: "Bảo Tàng TPHCM", coords: [10.776069676733153, 106.6995407994018], category: "thanhpho", page: "baotangtphcm.html" },
  { name: "Bảo Tàng Hồ Chí Minh", coords: [10.768159642716595,106.70684673309313], category: "kientruc", page: "baotanghcm.html" },
  { name: "Bảo tàng Chứng tích Chiến tranh", coords: [10.779508902885842, 106.69208968489555], category: "baotang", page: "baotangchungtichchientranh.html" },
  { name: "Chùa Giác Lâm", coords: [10.778770,106.649202], category: "khu", page: "chuagiaclam.html" },
  { name: "Chợ Bình Tây", coords: [10.749373657444895,106.65105450437837], category: "thanhpho", page: "chobinhtay.html" },
  { name: "Chợ Bến Thành", coords: [10.772562285042808,106.69800620687107], category: "thanhpho", page: "chobenthanh.html" },
  { name: "Căn Cứ Rừng Sác", coords: [10.407547,106.888519], category: "quocgia", page: "cancurungsac.html" },
  { name: "Hầm giấu vũ khí biệt động", coords: [10.77215547871409,106.68593350431848], category: "quocgia", page: "cosogiauvukhi.html" },
  { name: "Khu trại giam Bệnh Viện Chợ Quán", coords: [10.75329276787438,106.67915915593466], category: "quocgia", page: "khugiamtraibenhvientroquan.html" },
  { name: "Lăng Lê Văn Duyệt", coords: [10.802218698128923,106.69712355857787], category: "quocgia", page: "langlevanduyet.html" },
  { name: "Lăng mộ Phan Châu Trinh", coords: [10.804371552261498,106.661775396652], category: "quocgia", page: "mophanchautrinh.html" },
  { name: "Nhà Thờ Đức Bà", coords: [10.779792558304973,106.69901819638865], category: "thanhpho", page: "nhathoducba.html" },
  { name: "Tịnh xá Ngọc Phương", coords: [10.81534827804912,106.68978491518055], category: "quocgia", page: "tinhxangocphuong.html" },
  { name: "Đình Phong Phú", coords: [10.832183577842558,106.78359777687334], category: "cachmang", page: "dinhphongphu.html" },
  { name: "Đình Thông Tây Hội", coords: [10.840034114033681,106.66492442289332], category: "kientruc", page: "dingthongtayhoi.html" },
  { name: "Địa đạo Củ Chi", coords: [11.141789146277686,106.46135436902648], category: "dacbiet", page: "diadaocuchi.html" },
  { name: "Địa đạo Phú Thọ Hòa", coords: [10.783885492854845,106.63090098482986], category: "quocgia", page: "diadaophuthohoa.html" },
  { name: "Nhà hát TPHCM", coords: [10.776713503847871,106.7031885226206], category: "kientruc", page: "nhahattphcm.html" },
  { name: "Dinh Độc Lập", coords: [10.777067977226276,106.69528064173029], category: "dacbiet", page: "dinhdoclap.html" },
  { name: "Đình Chí Hòa", coords: [10.78144580194108,106.67316163457637], category: "kientruc", page: "dinhchihoa.html" },
  { name: "Chùa Giác Viên", coords: [10.76318460966222,106.6398107945002], category: "kientruc", page: "chuagiacvien.html" },
  { name: "Lò Gốm Cổ Hưng Lợi", coords: [10.725087405329568,106.62630157120653], category: "khaoco", page: "logom.html" },
  { name: "Ngã Ba Giồng", coords: [10.868358706057167,106.56114532344505], category: "quocgia", page: "ngabagiong.html" },
  { name: "Trụ sở UBND", coords: [10.776564644610339,106.70090517485895], category: "kientruc", page: "trusoubndtphcm.html" },
  { name: "Đình Bình Đông", coords: [10.727827252842598,106.64129241658803], category: "quocgia", page: "dinhbinhdong.html" },
];



const markerObjects = data.map(item => {
  const marker = L.marker(item.coords).bindPopup(`
  <div class="popup-content">
    <h3>${item.name}</h3>
    <a href="${item.page}" class="popup-btn" target="_blank">Xem thêm</a>
  </div>
`);

  
  marker.category = item.category;
  marker.name = item.name;
  markerCluster.addLayer(marker);
  return marker;
});

  // --- Filter ---
  let activeFilter = "all";
  function applyFilter(category) {
    activeFilter = category;
    markerCluster.clearLayers();
    markerObjects.forEach(m => {
      if (activeFilter === "all" || m.category === activeFilter) {
        markerCluster.addLayer(m);
      }
    });
    searchInput.value = "";
    suggestions.style.display = "none";
  }

  // --- Search ---
  const searchInput = document.getElementById("search");
  const suggestions = document.getElementById("suggestions");

  function removeAccents(str) {
    return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }

  searchInput.addEventListener("input", () => {
    const query = removeAccents(searchInput.value.trim());
    suggestions.innerHTML = "";
    if (!query) {
      suggestions.style.display = "none";
      return;
    }
    const matches = markerObjects.filter(m =>
      (activeFilter === "all" || m.category === activeFilter) &&
      removeAccents(m.name).includes(query)
    );
    if (matches.length) {
      suggestions.style.display = "block";
      matches.forEach(m => {
        const li = document.createElement("li");
        const regex = new RegExp(`(${query})`, "gi");
        const highlightedName = m.name.replace(regex, "<strong>$1</strong>");
        li.innerHTML = highlightedName;
        li.addEventListener("click", () => {
          map.setView(m.getLatLng(), 16, { animate: true });
          m.openPopup();
          suggestions.style.display = "none";
        });
        suggestions.appendChild(li);
      });
    } else {
      suggestions.style.display = "none";
    }
  });

  document.addEventListener("click", (e) => {
    if (!document.querySelector(".search-bar").contains(e.target)) {
      suggestions.style.display = "none";
    }
  });

  // Fullscreen logic
const mapDiv = document.getElementById('map');
const fullscreenBtn = document.getElementById('fullscreen-btn');
fullscreenBtn.addEventListener('click', () => {
  if (!document.fullscreenElement && !mapDiv.classList.contains('fullscreen')) {
    if (mapDiv.requestFullscreen) {
      mapDiv.requestFullscreen();
    } else if (mapDiv.webkitRequestFullscreen) {
      mapDiv.webkitRequestFullscreen();
    } else if (mapDiv.msRequestFullscreen) {
      mapDiv.msRequestFullscreen();
    }
    mapDiv.classList.add('fullscreen');
    document.body.classList.add('fullscreen-active');
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    } else if (document.msExitFullscreen) {
      document.msExitFullscreen();
    }
    mapDiv.classList.remove('fullscreen');
    document.body.classList.remove('fullscreen-active');
  }
});
// Keep map size correct on fullscreen change
function handleFullscreenChange() {
  if (!document.fullscreenElement) {
    mapDiv.classList.remove('fullscreen');
    document.body.classList.remove('fullscreen-active');
  } else {
    mapDiv.classList.add('fullscreen');
    document.body.classList.add('fullscreen-active');
  }
  if (window.map && window.map.invalidateSize) {
    setTimeout(() => window.map.invalidateSize(), 300);
  }
}
document.addEventListener('fullscreenchange', handleFullscreenChange);
document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
document.addEventListener('mozfullscreenchange', handleFullscreenChange);
document.addEventListener('MSFullscreenChange', handleFullscreenChange);
</script>

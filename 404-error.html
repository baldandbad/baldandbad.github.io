<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Game Lobby</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #fff;
      color: #333;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      padding: 30px;
      width: 400px;
      max-width: 90%;
      text-align: center;
      animation: fadeIn 0.6s ease-in-out;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 1.8em;
      color: #444;
    }

    h2 {
      margin: 15px 0 10px;
      color: #555;
    }

    input {
      width: 80%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 1em;
    }

    button {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .room {
      margin: 15px 0;
      padding: 10px;
      border-radius: 10px;
      background: #f5f5f5;
      font-weight: bold;
      font-size: 1.2em;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 10px 0;
    }

    ul li {
      background: #eee;
      margin: 5px 0;
      padding: 8px;
      border-radius: 8px;
      transition: transform 0.2s;
    }

    ul li:hover {
      transform: scale(1.03);
      background: #ddd;
    }

    hr {
      margin: 20px 0;
      border: 0;
      height: 1px;
      background: #ccc;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Quiz Game</h1>
    
    <div id="host">
      <h2>Host a Game</h2>
      <button onclick="createRoom()">Create Room</button>
      <div id="roomCode" class="room"></div>
      <ul id="players"></ul>
    </div>

    <hr>

    <div id="player">
      <h2>Join a Game</h2>
      <input type="text" id="name" placeholder="Your Name">
      <input type="text" id="code" placeholder="Room Code">
      <button onclick="joinRoom()">Join</button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io("http://localhost:3000"); // CHANGE to your Railway backend URL

    function createRoom() {
      socket.emit("createRoom");
    }

    socket.on("roomCreated", ({ code }) => {
      document.getElementById("roomCode").innerText = "Room Code: " + code;
    });

    function joinRoom() {
      const name = document.getElementById("name").value;
      const code = document.getElementById("code").value;
      socket.emit("joinRoom", { code, name });
    }

    socket.on("playerJoined", (player) => {
      const li = document.createElement("li");
      li.innerText = player.name;
      document.getElementById("players").appendChild(li);
    });

    socket.on("updateScores", (players) => {
      console.log("Leaderboard update:", players);
    });
  </script>
</body>
</html>

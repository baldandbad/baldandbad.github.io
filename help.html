<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Game</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #74ABE2, #5563DE);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    #app {
      background: rgba(0, 0, 0, 0.5);
      padding: 2rem;
      border-radius: 16px;
      width: 450px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      animation: fadeIn 0.8s ease;
    }
    h1 {
      margin-bottom: 1rem;
      font-size: 2rem;
      animation: popIn 0.6s ease;
    }
    button {
      display: block;
      margin: 0.5rem auto;
      padding: 12px 22px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #ffcc00;
      color: #333;
      font-weight: bold;
      transition: transform 0.2s, background 0.3s;
    }
    button:hover {
      transform: scale(1.05);
      background: #ffdb4d;
    }
    .question {
      margin-bottom: 1rem;
      animation: slideUp 0.5s ease;
    }
    .score {
      font-size: 18px;
      margin-top: 1rem;
      animation: fadeIn 0.8s ease;
    }
    input[type="text"] {
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
      width: 80%;
      margin: 0.5rem auto;
      display: block;
      text-align: center;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>Quiz Game</h1>
    <div id="screen"></div>
  </div>

  <script>
    const API_URL = "http://localhost:3000"; // backend
    const screen = document.getElementById("screen");

    let questions = [];
    let currentIndex = 0;
    let score = 0;

    // Start menu
    function showMainMenu() {
      screen.innerHTML = `
        <h2>Choose Mode</h2>
        <button onclick="soloMode()">🎮 Solo Mode</button>
        <button onclick="roomMode()">👥 Room Mode</button>
      `;
    }

    // Solo mode
    async function soloMode() {
      const res = await fetch(API_URL + "/quizzes");
      const quizzes = await res.json();

      screen.innerHTML = "<h2>Select a Quiz</h2>";
      quizzes.forEach(q => {
        const btn = document.createElement("button");
        btn.textContent = q.title;
        btn.onclick = () => startQuiz(q.id);
        screen.appendChild(btn);
      });
    }

    // Room mode
    function roomMode() {
      screen.innerHTML = `
        <h2>Room Mode</h2>
        <button onclick="hostRoom()">📢 Host Room</button>
        <button onclick="joinRoom()">🔑 Join Room</button>
        <button onclick="showMainMenu()">⬅ Back</button>
      `;
    }

    async function hostRoom() {
      screen.innerHTML = `<h2>Hosting Room...</h2><p>Share this Room ID: <b>12345</b></p>`;
      // You can later replace with backend-generated ID + WebSocket
    }

    function joinRoom() {
      screen.innerHTML = `
        <h2>Join Room</h2>
        <input id="roomId" type="text" placeholder="Enter Room ID" />
        <button onclick="enterRoom()">Join</button>
        <button onclick="roomMode()">⬅ Back</button>
      `;
    }

    function enterRoom() {
      const roomId = document.getElementById("roomId").value;
      screen.innerHTML = `<h2>Joined Room ${roomId}</h2><p>Waiting for host...</p>`;
    }

    // Quiz logic
    async function startQuiz(quizId) {
      const res = await fetch(`${API_URL}/quizzes/${quizId}/questions`);
      questions = await res.json();
      currentIndex = 0;
      score = 0;
      showQuestion();
    }

    function showQuestion() {
      if (currentIndex >= questions.length) {
        showResult();
        return;
      }

      const q = questions[currentIndex];
      screen.innerHTML = `
        <div class="question">
          <h2>${q.text}</h2>
        </div>
      `;

      q.answers.forEach(ans => {
        const btn = document.createElement("button");
        btn.textContent = ans.text;
        btn.onclick = () => {
          if (ans.is_correct) {
            score++;
            btn.style.background = "limegreen";
          } else {
            btn.style.background = "crimson";
          }
          setTimeout(() => {
            currentIndex++;
            showQuestion();
          }, 600);
        };
        screen.appendChild(btn);
      });
    }

    function showResult() {
      screen.innerHTML = `
        <h2>Quiz Finished!</h2>
        <div class="score">Your Score: ${score} / ${questions.length}</div>
        <button onclick="soloMode()">Play Again</button>
        <button onclick="showMainMenu()">🏠 Main Menu</button>
      `;
    }

    // Start on main menu
    showMainMenu();
  </script>
</body>
</html>
